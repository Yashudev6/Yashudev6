<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Yash Savita animated developer banner</title><desc id="desc">Dark terminal-themed banner with a typing effect and neon purple blue gradients.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090B18"/><stop offset=".55" stop-color="#17102E"/><stop offset="1" stop-color="#071A2B"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67E8F9"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#F0ABFC"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9B8AFB" stroke-opacity=".09" stroke-width="1"/></pattern>
 <clipPath id="round"><rect width="1200" height="390" rx="24"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="1200" height="390" fill="url(#bg)"/><rect width="1200" height="390" fill="url(#grid)"/>
<circle cx="1040" cy="100" r="160" fill="#7C3AED" opacity=".12"><animate attributeName="r" values="145;170;145" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="980" cy="300" r="190" fill="#06B6D4" opacity=".08"><animate attributeName="r" values="180;205;180" dur="8s" repeatCount="indefinite"/></circle>
<rect x="42" y="34" width="1116" height="322" rx="18" fill="#0A0D19" fill-opacity=".52" stroke="#A78BFA" stroke-opacity=".38"/>
<circle cx="72" cy="60" r="5" fill="#FB7185"/><circle cx="91" cy="60" r="5" fill="#FBBF24"/><circle cx="110" cy="60" r="5" fill="#34D399"/>
<text x="135" y="65" fill="#8B93B0" font-family="monospace" font-size="13">yash@github:~ / profile</text>
<text x="78" y="116" fill="#67E8F9" font-family="monospace" font-size="15">$ whoami</text>
<text x="76" y="177" fill="url(#neon)" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" filter="url(#glow)">Yash Savita</text>
<text x="79" y="211" fill="#D8D7F4" font-family="monospace" font-size="17">Computer Science Student  •  Full-Stack Developer</text>
<text x="79" y="249" fill="#9BA7C9" font-family="monospace" font-size="15">const mindset = "Build ideas into reality";</text>
<text x="79" y="280" fill="#A5B4FC" font-family="monospace" font-size="14">MERN Stack · Java · Python · REST APIs · Databases</text>
<text x="79" y="316" fill="#67E8F9" font-family="monospace" font-size="14">$ keep_learning(); keep_building();<tspan fill="#F0ABFC">▌<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
<g transform="translate(940 142)">
 <circle cx="0" cy="0" r="68" fill="#111827" stroke="url(#neon)" stroke-width="2" stroke-dasharray="7 8"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/></circle>
 <circle cx="0" cy="0" r="50" fill="#13152B" stroke="#67E8F9" stroke-opacity=".4"/>
 <text x="0" y="-3" text-anchor="middle" font-size="35" fill="#E9D5FF" font-family="monospace">&lt;/&gt;</text>
 <text x="0" y="22" text-anchor="middle" font-size="10" fill="#67E8F9" font-family="monospace">DEV MODE</text>
</g>
<path d="M0 335 H1200" stroke="url(#neon)" stroke-opacity=".75"><animate attributeName="stroke-opacity" values=".25;.9;.25" dur="3.5s" repeatCount="indefinite"/></path>
<rect x="-10" y="0" width="5" height="390" fill="#67E8F9" opacity=".65" filter="url(#glow)"><animate attributeName="x" values="-10;1210;-10" dur="8s" repeatCount="indefinite"/></rect>
</g></svg>