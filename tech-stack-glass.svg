<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Yash's Tech Stack</title>
  <desc id="desc">A glassmorphism-style collection of programming languages, frontend, backend, databases, and tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset=".52" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#201334"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".17"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".045"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset=".52" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="55" r="160" fill="#8b5cf6" opacity=".13"/>
  <circle cx="90" cy="420" r="180" fill="#22d3ee" opacity=".10"/>
  <rect x="1" y="1" width="1198" height="498" rx="27" fill="none" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="40" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#a5f3fc">YASH / DEVELOPER TOOLKIT</text>
  <text x="40" y="88" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="750" fill="#f8fafc">Tech Stack</text>
  <rect x="40" y="105" width="160" height="4" rx="2" fill="url(#accent)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#f1f5f9">
    <text x="40" y="145" font-size="12" letter-spacing="1.8" fill="#a5b4fc">LANGUAGES</text>
    <g filter="url(#shadow)">
      <rect x="40" y="160" width="116" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="58" cy="181" r="5" fill="#f59e0b"/><text x="72" y="186">Java</text>
      <rect x="168" y="160" width="126" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="186" cy="181" r="5" fill="#60a5fa"/><text x="200" y="186">Python</text>
      <rect x="306" y="160" width="150" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="324" cy="181" r="5" fill="#fde047"/><text x="338" y="186">JavaScript</text>
      <rect x="468" y="160" width="150" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="486" cy="181" r="5" fill="#60a5fa"/><text x="500" y="186">TypeScript</text>
      <rect x="630" y="160" width="100" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="648" cy="181" r="5" fill="#38bdf8"/><text x="662" y="186">Dart</text>
      <rect x="742" y="160" width="104" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="760" cy="181" r="5" fill="#fb923c"/><text x="774" y="186">HTML5</text>
      <rect x="858" y="160" width="94" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="876" cy="181" r="5" fill="#60a5fa"/><text x="890" y="186">CSS3</text>
    </g>
    <text x="40" y="235" font-size="12" letter-spacing="1.8" fill="#a5f3fc">FRONTEND &amp; MOBILE</text>
    <g filter="url(#shadow)">
      <rect x="40" y="250" width="112" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="58" cy="271" r="5" fill="#67e8f9"/><text x="72" y="276">React</text>
      <rect x="164" y="250" width="128" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="182" cy="271" r="5" fill="#f8fafc"/><text x="196" y="276">Next.js</text>
      <rect x="304" y="250" width="160" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="322" cy="271" r="5" fill="#2dd4bf"/><text x="336" y="276">Tailwind CSS</text>
      <rect x="476" y="250" width="112" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="494" cy="271" r="5" fill="#38bdf8"/><text x="508" y="276">Flutter</text>
      <rect x="600" y="250" width="112" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="618" cy="271" r="5" fill="#a78bfa"/><text x="632" y="276">Figma</text>
    </g>
    <text x="40" y="325" font-size="12" letter-spacing="1.8" fill="#d8b4fe">BACKEND &amp; DATA</text>
    <g filter="url(#shadow)">
      <rect x="40" y="340" width="126" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="58" cy="361" r="5" fill="#86efac"/><text x="72" y="366">Node.js</text>
      <rect x="178" y="340" width="138" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="196" cy="361" r="5" fill="#cbd5e1"/><text x="210" y="366">Express.js</text>
      <rect x="328" y="340" width="138" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="346" cy="361" r="5" fill="#4ade80"/><text x="360" y="366">MongoDB</text>
      <rect x="478" y="340" width="104" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="496" cy="361" r="5" fill="#60a5fa"/><text x="510" y="366">MySQL</text>
      <rect x="594" y="340" width="142" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="612" cy="361" r="5" fill="#93c5fd"/><text x="626" y="366">PostgreSQL</text>
      <rect x="748" y="340" width="126" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="766" cy="361" r="5" fill="#fb923c"/><text x="780" y="366">REST APIs</text>
    </g>
    <text x="40" y="415" font-size="12" letter-spacing="1.8" fill="#f0abfc">TOOLS &amp; PLATFORM</text>
    <g filter="url(#shadow)">
      <rect x="40" y="430" width="92" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="58" cy="451" r="5" fill="#fb923c"/><text x="72" y="456">Git</text>
      <rect x="144" y="430" width="112" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="162" cy="451" r="5" fill="#e2e8f0"/><text x="176" y="456">GitHub</text>
      <rect x="268" y="430" width="166" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="286" cy="451" r="5" fill="#f97316"/><text x="300" y="456">GitHub Actions</text>
      <rect x="446" y="430" width="120" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="464" cy="451" r="5" fill="#fb923c"/><text x="478" y="456">Postman</text>
      <rect x="578" y="430" width="120" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="596" cy="451" r="5" fill="#2dd4bf"/><text x="610" y="456">Supabase</text>
      <rect x="710" y="430" width="116" height="42" rx="13" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/><circle cx="728" cy="451" r="5" fill="#facc15"/><text x="742" y="456">Firebase</text>
    </g>
  </g>
  <text x="1160" y="475" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#94a3b8">FROSTED GLASS • BUILD • SHIP • LEARN</text>
</svg>