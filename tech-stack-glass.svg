<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Yash's Tech Stack</title>
  <desc id="desc">Technology logos and names displayed in clean transparent glass-style buttons.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".16"/>
      <stop offset=".52" stop-color="#94a3b8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".68"/>
      <stop offset=".5" stop-color="#94a3b8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity=".68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-35%" width="140%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity=".13"/>
    </filter>
    <style>
      .label { font: 600 13px Inter, 'Segoe UI', Arial, sans-serif; fill: #64748b; letter-spacing: 1.8px; }
      .name { font: 600 14px Inter, 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .pill { fill: url(#glass); stroke: url(#edge); stroke-width: 1; }
    </style>
  </defs>
  <text x="18" y="24" class="label">LANGUAGES</text>
  <g filter="url(#shadow)">
    <g transform="translate(18 38)"><rect class="pill" width="128" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/java/java-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">Java</text></g>
    <g transform="translate(158 38)"><rect class="pill" width="128" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">Python</text></g>
    <g transform="translate(298 38)"><rect class="pill" width="150" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">JavaScript</text></g>
    <g transform="translate(460 38)"><rect class="pill" width="150" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/typescript/typescript-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">TypeScript</text></g>
    <g transform="translate(622 38)"><rect class="pill" width="116" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/dart/dart-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">Dart</text></g>
    <g transform="translate(750 38)"><rect class="pill" width="126" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">HTML5</text></g>
    <g transform="translate(888 38)"><rect class="pill" width="112" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">CSS3</text></g>
  </g>
  <text x="18" y="116" class="label">FRONTEND &amp; MOBILE</text>
  <g filter="url(#shadow)">
    <g transform="translate(18 130)"><rect class="pill" width="128" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">React</text></g>
    <g transform="translate(158 130)"><rect class="pill" width="128" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nextjs/nextjs-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">Next.js</text></g>
    <g transform="translate(298 130)"><rect class="pill" width="160" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/tailwindcss/tailwindcss-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">Tailwind CSS</text></g>
    <g transform="translate(470 130)"><rect class="pill" width="128" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/flutter/flutter-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">Flutter</text></g>
    <g transform="translate(610 130)"><rect class="pill" width="118" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/figma/figma-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">Figma</text></g>
  </g>
  <text x="18" y="208" class="label">BACKEND &amp; DATABASES</text>
  <g filter="url(#shadow)">
    <g transform="translate(18 222)"><rect class="pill" width="128" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nodejs/nodejs-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">Node.js</text></g>
    <g transform="translate(158 222)"><rect class="pill" width="142" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/express/express-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">Express.js</text></g>
    <g transform="translate(312 222)"><rect class="pill" width="142" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mongodb/mongodb-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">MongoDB</text></g>
    <g transform="translate(466 222)"><rect class="pill" width="112" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mysql/mysql-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">MySQL</text></g>
    <g transform="translate(590 222)"><rect class="pill" width="150" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/postgresql/postgresql-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">PostgreSQL</text></g>
    <g transform="translate(752 222)"><rect class="pill" width="138" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/swagger/swagger-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">REST APIs</text></g>
  </g>
  <text x="18" y="300" class="label">TOOLS &amp; PLATFORM</text>
  <g filter="url(#shadow)">
    <g transform="translate(18 314)"><rect class="pill" width="104" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/git/git-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">Git</text></g>
    <g transform="translate(134 314)"><rect class="pill" width="118" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">GitHub</text></g>
    <g transform="translate(264 314)"><rect class="pill" width="130" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/postman/postman-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">Postman</text></g>
    <g transform="translate(406 314)"><rect class="pill" width="134" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/supabase/supabase-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">Supabase</text></g>
    <g transform="translate(552 314)"><rect class="pill" width="130" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/firebase/firebase-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">Firebase</text></g>
    <g transform="translate(694 314)"><rect class="pill" width="160" height="48" rx="15"/><image href="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/githubactions/githubactions-original.svg" x="13" y="12" width="24" height="24"/><text class="name" x="47" y="29">GitHub Actions</text></g>
  </g>
</svg>